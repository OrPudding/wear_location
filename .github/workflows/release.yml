name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  check:
    name: Check package
    uses: ./.github/workflows/check.yml

  publish:
    name: Publish release
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release metadata
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          version = re.search(r'^version:\s*(\S+)', Path('pubspec.yaml').read_text(), re.MULTILINE).group(1)
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              if os.environ['GITHUB_REF_NAME'] != 'v' + version:
                  raise SystemExit('Release tag does not match pubspec.yaml version')
          sdk = json.loads(Path('.fvmrc').read_text())['flutter']
          if sdk != os.environ['FLUTTER_VERSION']:
              raise SystemExit('Workflow Flutter version does not match .fvmrc')
          PYTHON

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
