group 'org.oroncanopy.wear_location'
version '0.1.1'
apply plugin: 'com.android.library'
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlin = agpMajor >= 9 &&
    providers.gradleProperty('android.builtInKotlin').orElse('true').get().toBoolean()
if (!builtInKotlin) {
    pluginManager.apply('org.jetbrains.kotlin.android')
}
android {
    namespace 'org.oroncanopy.wear_location'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
